name: reference tooling

on:
  push:
    branches: [main]
    paths:
      - "tooling/**"
      - "sharur-bundle-spec.yaml"
      - "sharur-bundle.json"
      - ".github/workflows/tooling.yml"
  pull_request:
    paths:
      - "tooling/**"
      - "sharur-bundle-spec.yaml"
      - "sharur-bundle.json"
      - ".github/workflows/tooling.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: tooling

jobs:
  unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run unit tests
        run: python -m pytest -v

  # Both smoke jobs use a non-editable install, so they also check that the
  # package builds and its entry points work the way a third party would use them.
  smoke-verifier:
    name: smoke test (verifier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install .
      - name: Verify sample bundle and conformance fixtures
        run: tests/smoke/verify.sh

  smoke-replayer:
    name: smoke test (replayer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install .
      - name: Replay sample bundle
        run: tests/smoke/replay.sh
